{% extends "base.html" %}
{% block titulo %}Eliminar usuario{% endblock %}
{% block contenido %}
<h1>Eliminar usuario</h1>
<div class="tarjeta">
  <p>¿Confirmas que quieres eliminar al usuario <strong>{{ object.username }}</strong>? Esta acción no se puede deshacer.</p>
  <form method="post">
    {% csrf_token %}
    <div class="botones">
      <button class="boton peligro" type="submit">Sí, eliminar</button>
      <a class="boton secundario" href="{% url 'usuarios_listar' %}">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
