{% extends "base.html" %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block contenido %}
<div class="centro-login">
  <div class="tarjeta">
    <h1>Iniciar sesión</h1>
    <form class="formulario" method="post">
      {% csrf_token %}
      {% if form.errors %}
        <div class="mensaje error">Usuario o contraseña incorrectos.</div>
      {% endif %}
      <p>
        <label for="id_username">Usuario</label>
        <input type="text" name="username" id="id_username" required autofocus>
      </p>
      <p>
        <label for="id_password">Contraseña</label>
        <input type="password" name="password" id="id_password" required>
      </p>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="boton" style="width:100%;">Entrar</button>
    </form>
  </div>
</div>
{% endblock %}
