{% extends "base.html" %}
{% block titulo %}Eliminar médico{% endblock %}
{% block contenido %}
<h1>Eliminar médico</h1>
<div class="tarjeta">
  <p>¿Confirmas que quieres eliminar a <strong>{{ object.nombre_completo }}</strong>? Esta acción no se puede deshacer.</p>
  <form method="post">
    {% csrf_token %}
    <div class="botones">
      <button class="boton peligro" type="submit">Sí, eliminar</button>
      <a class="boton secundario" href="{% url 'medicos:listar' %}">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
