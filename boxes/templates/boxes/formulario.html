{% extends "base.html" %}
{% block titulo %}{% if object %}Editar box{% else %}Nuevo box{% endif %}{% endblock %}
{% block contenido %}
<h1>{% if object %}Editar box{% else %}Nuevo box{% endif %}</h1>
<div class="tarjeta">
  <form class="formulario" method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="botones">
      <button class="boton" type="submit">Guardar</button>
      <a class="boton secundario" href="{% url 'boxes:listar' %}">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
