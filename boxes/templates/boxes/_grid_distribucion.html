<div class="boxes-grid">
  {% for item in lista %}
  <div class="box-tarjeta{% if not item.reglas %} vacio{% endif %}">
    <div class="nombre">{{ item.box.nombre }}</div>
    {% if item.reglas %}
      {% for regla in item.reglas %}
        <div class="medico">{{ regla.medico }} <small>({{ regla.dia }})</small></div>
      {% endfor %}
    {% else %}
      <div class="medico">Sin médico asignado</div>
    {% endif %}
  </div>
  {% empty %}
  <p>No hay boxes en este piso.</p>
  {% endfor %}
</div>
